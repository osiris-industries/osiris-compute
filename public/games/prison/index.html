<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Osiris — La Sombra (prison)</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b0b0c;overflow:hidden;font-family:'IBM Plex Mono',ui-monospace,monospace;color:#f1f1ef;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  .hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);font-size:12px;color:#cfcfca;background:rgba(11,11,12,.7);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 12px;pointer-events:none;z-index:5}
  /* touch controls */
  #pad{position:fixed;left:14px;bottom:14px;width:132px;height:132px;z-index:6;opacity:.85}
  #pad button{position:absolute;width:44px;height:44px;background:rgba(20,22,28,.85);border:1px solid rgba(255,255,255,.2);color:#f1f1ef;border-radius:8px;font-size:16px}
  #pu{left:44px;top:0}#pd{left:44px;top:88px}#pl{left:0;top:44px}#pr{left:88px;top:44px}
  #talk{position:fixed;right:16px;bottom:30px;z-index:6;background:#12212e;border:1px solid #2a4356;color:#e8eef2;border-radius:26px;padding:14px 22px;font:inherit;font-size:15px;opacity:.9;display:none}
  #dlg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(94vw,560px);z-index:8;display:none;
       background:#0d1620;border:1px solid #22384a;border-radius:12px;padding:14px 16px}
  #dlg .who{font-size:12px;color:#7fd1a3;margin-bottom:4px}
  #dlg .line{font-size:15px;line-height:1.5;color:#f1f1ef;white-space:pre-wrap}
  #dlg .x{position:absolute;right:10px;top:8px;background:none;border:none;color:#9fb3c4;font-size:18px}
  #dlg{width:min(94vw,560px);max-height:72vh;display:none;flex-direction:column}
  #dlg .hist{flex:1;overflow-y:auto;max-height:40vh;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  #dlg .m{font-size:14px;line-height:1.45;padding:6px 10px;border-radius:10px;max-width:85%;word-break:break-word}
  #dlg .m.npc{align-self:flex-start;background:#12212e;border:1px solid #22384a;color:#f1f1ef}
  #dlg .m.you{align-self:flex-end;background:#1b3a2b;border:1px solid #2f5a44;color:#eafff2}
  #dlg .m.sys{align-self:center;color:#8a8a86;font-size:12px;background:none}
  #dlg .inrow{display:flex;gap:8px}
  #dlg #din{flex:1;background:#0b0f14;color:#f1f1ef;border:1px solid #2a333d;border-radius:8px;padding:9px;font:inherit;font-size:14px;outline:none}
  #dlg #dsend{background:#12212e;color:#e8eef2;border:1px solid #2a4356;border-radius:8px;padding:9px 14px;font:inherit}
  #dlg #dsend:disabled{opacity:.5}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="hint" id="hint">WASD / arrows to move · walk up to someone to talk</div>
<div id="pad">
  <button id="pu">▲</button><button id="pd">▼</button><button id="pl">◀</button><button id="pr">▶</button>
</div>
<button id="talk">Talk</button>
<div id="dlg">
  <button class="x" id="dx">&#10005;</button>
  <div class="who" id="dwho"></div>
  <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin:4px 0 8px;overflow:hidden"><i id="dmeter" style="display:block;height:100%;width:50%;background:#7fd1a3;transition:width .3s,background .3s"></i></div>
  <div class="hist" id="dhist"></div>
  <div class="inrow"><input id="din" placeholder="type your reply&#8230;" autocomplete="off"><button id="dsend">Send</button></div>
</div>
<script>
(function(){
  var TILE=16, COLS=12; // tilesheet columns
  var img=new Image(); img.src="tiles.png";
  var DEV=/[?&]dev=1/.test(location.search);

  // ---- legend: char -> {t: tile index, solid} ----
  var L={
    '#':{t:57,s:1}, '.':{t:48,s:0}, '=':{t:77,s:1}, 'D':{t:45,s:0},
    'b':{t:81,s:1}, 'B':{t:82,s:1}, 'T':{t:72,s:1}, 'c':{t:63,s:1}, 'P':{t:48,s:0}, ' ':{t:-1,s:1}
  };
  // ---- map (40 wide). cell block top-left, yard center, mess-hall tables right ----
  var MAP=[
   "########################################",
   "#B..#b..#b..#b..#......................#",
   "#...#...#...#...#....TT....TT....TT....#",
   "#=D=#===#===#===#.....................D#",
   "#..............#......................#",
   "#.....P........#....TT....TT....TT....#",
   "#..............#......................#",
   "#..............#......................#",
   "#######D########......................#",
   "#....................................#",
   "#...c...........c....................#",
   "#....................................#",
   "#...............c.......c............#",
   "#....................................#",
   "#....c................c..............#",
   "#....................................#",
   "#..........c.................c.......#",
   "#....................................#",
   "#....................................#",
   "#....................................#",
   "#....................................#",
   "########################################"
  ];
  var W=Math.max.apply(null,MAP.map(function(r){return r.length;}));
  MAP=MAP.map(function(r){ return r.length<W ? r.slice(0,-1)+Array(W-r.length+1).join(".")+r.slice(-1) : r; });
  var H=MAP.length;
  function at(cx,cy){ if(cy<0||cy>=H||cx<0||cx>=W) return ' '; return MAP[cy][cx]; }
  function solidPx(px,py){ var cx=Math.floor(px/TILE), cy=Math.floor(py/TILE); var d=L[at(cx,cy)]; return !d||d.s; }

  // ---- entities ----
  function find(ch){ for(var y=0;y<H;y++){var x=MAP[y].indexOf(ch); if(x>=0) return {x:x,y:y};} return {x:2,y:2}; }
  var pstart=find('P');
  var player={ x:pstart.x*TILE+2, y:pstart.y*TILE+2, spr:85 };
  // NPCs: tile 88 bunkmate(EN), 96/97 guards, 87 gang tough, 100/111/112 inmates. lang for later AI routing.
  var npcs=[
    {cx:1,cy:1,spr:88,name:"Miguel (bunkmate)",lang:"en",respect:0,
     line:"Hey. Keep your head down, cabrón. Don't stare at nobody.",
     sys:"You are Miguel, an English-speaking cellmate to a newcomer wrongly jailed in a Mexican prison. Street-smart, wary, dryly funny, quietly protective of the new guy. Answer in ONE short sentence, in character. Dialogue only, no narration, no stage directions."},
    {cx:23,cy:5,spr:87,name:"El Jefe",lang:"es",respect:0,
     line:"¿Y tú quién eres? No te conozco... cuidado con lo que dices.",
     sys:"Eres El Jefe, el líder temido de una prisión mexicana. Orgulloso, territorial, peligroso; pruebas a los nuevos. Contesta SOLO en español, UNA frase corta, en personaje. Solo diálogo, sin narración."},
    {cx:31,cy:2,spr:100,name:"El Viejo",lang:"es",respect:0,
     line:"La comida aquí es una porquería, joven. ¿Tienes cigarros?",
     sys:"Eres El Viejo, un preso anciano y filosófico en una prisión mexicana; siempre pides cigarros. Contesta SOLO en español, UNA frase corta, en personaje. Solo diálogo."},
    {cx:20,cy:5,spr:111,name:"Chuy",lang:"es",respect:0,
     line:"Oye, gringo. ¿Sabes jugar dominó o no?",
     sys:"Eres Chuy, un preso chismoso y casual que quiere jugar dominó en una prisión mexicana. Contesta SOLO en español, UNA frase corta, en personaje. Solo diálogo."},
    {cx:7,cy:9,spr:96,name:"Guardia",lang:"es",respect:0,
     line:"¡Camina! No te detengas en el pasillo.",
     sys:"Eres un guardia autoritario y seco de una prisión mexicana; das órdenes. Contesta SOLO en español, UNA frase corta, en personaje. Solo diálogo."},
    {cx:14,cy:14,spr:112,name:"Flaco",lang:"es",respect:0,
     line:"Tsss... ¿traes algo para mí? Aquí todo tiene precio.",
     sys:"Eres Flaco, un preso nervioso que trafica de todo; para ti todo tiene precio. Contesta SOLO en español, UNA frase corta, en personaje. Solo diálogo."}
  ];

  // ---- render ----
  var cv=document.getElementById("c"), ctx=cv.getContext("2d");
  var VW,VH,SCALE;
  function resize(){ cv.width=innerWidth; cv.height=innerHeight;
    SCALE=Math.max(2, Math.min(4, Math.floor(Math.min(innerWidth,innerHeight)/180)));
    VW=cv.width; VH=cv.height; ctx.imageSmoothingEnabled=false; }
  addEventListener("resize",resize); resize();
  var cam={x:0,y:0};
  function drawTile(t,dx,dy){ if(t<0) return; var sx=(t%COLS)*TILE, sy=Math.floor(t/COLS)*TILE;
    ctx.drawImage(img,sx,sy,TILE,TILE,dx,dy,TILE*SCALE,TILE*SCALE); }
  function render(){
    ctx.fillStyle="#07080a"; ctx.fillRect(0,0,VW,VH);
    var ox=Math.floor(cam.x-VW/2), oy=Math.floor(cam.y-VH/2);
    var c0=Math.floor(ox/(TILE*SCALE))-1, r0=Math.floor(oy/(TILE*SCALE))-1;
    var cn=Math.ceil(VW/(TILE*SCALE))+2, rn=Math.ceil(VH/(TILE*SCALE))+2;
    for(var r=r0;r<r0+rn;r++) for(var c=c0;c<c0+cn;c++){
      var d=L[at(c,r)]; if(!d) continue;
      var dx=c*TILE*SCALE-ox, dy=r*TILE*SCALE-oy;
      if(d.t!==48 && at(c,r)!==' ') drawTile(48,dx,dy); // floor under props
      drawTile(d.t,dx,dy);
    }
    // npcs
    npcs.forEach(function(n){ var dx=n.cx*TILE*SCALE-ox, dy=n.cy*TILE*SCALE-oy; drawTile(n.spr,dx,dy);
      ctx.fillStyle="rgba(11,11,12,.75)"; ctx.font=(9*1)+"px monospace"; var w=ctx.measureText(n.name).width+6;
      ctx.fillRect(dx+TILE*SCALE/2-w/2,dy-13,w,12); ctx.fillStyle=n.lang==="en"?"#7fd1a3":"#e6c07b";
      ctx.textAlign="center"; ctx.fillText(n.name,dx+TILE*SCALE/2,dy-4); });
    // player
    if(!DEV){ drawTile(player.spr, Math.floor(player.x*SCALE-ox), Math.floor(player.y*SCALE-oy)); }
  }

  // ---- input ----
  var keys={};
  addEventListener("keydown",function(e){ if(e.target&&e.target.tagName==="INPUT"){ if(e.key==="Enter") sendReply(); return; } keys[e.key.toLowerCase()]=1; if(e.key===" "||e.key==="e"){e.preventDefault(); tryTalk();} });
  addEventListener("keyup",function(e){ keys[e.key.toLowerCase()]=0; });
  function held(dir){ if(dir==="u")return keys["arrowup"]||keys["w"]||tp.u; if(dir==="d")return keys["arrowdown"]||keys["s"]||tp.d;
    if(dir==="l")return keys["arrowleft"]||keys["a"]||tp.l; return keys["arrowright"]||keys["d"]||tp.r; }
  var tp={u:0,d:0,l:0,r:0};
  function bindPad(id,k){ var b=document.getElementById(id);
    var on=function(e){e.preventDefault();tp[k]=1;}, off=function(e){e.preventDefault();tp[k]=0;};
    b.addEventListener("touchstart",on);b.addEventListener("touchend",off);b.addEventListener("touchcancel",off);
    b.addEventListener("mousedown",on);b.addEventListener("mouseup",off);b.addEventListener("mouseleave",off); }
  bindPad("pu","u");bindPad("pd","d");bindPad("pl","l");bindPad("pr","r");
  document.getElementById("talk").addEventListener("click",tryTalk);
  document.getElementById("dx").addEventListener("click",function(){ document.getElementById("dlg").style.display="none"; CONV.npc=null; });
  document.getElementById("dsend").addEventListener("click",sendReply);

  // ---- talk (STUB — this is where the circle's Spanish-speaking model hooks in later) ----
  function nearNpc(){ var best=null,bd=1e9; npcs.forEach(function(n){ var dx=(n.cx*TILE+8)-(player.x+8), dy=(n.cy*TILE+8)-(player.y+8);
    var d=dx*dx+dy*dy; if(d<bd){bd=d;best=n;} }); return bd< (TILE*1.6)*(TILE*1.6) ? best : null; }
  var CONV={npc:null, busy:false};
  function esc(t){ return String(t).replace(/[<>]/g,function(c){return c==="<"?"&lt;":"&gt;";}); }
  function addMsg(cls,text){ var h=document.getElementById("dhist"), d=document.createElement("div"); d.className="m "+cls; d.innerHTML=esc(text); h.appendChild(d); h.scrollTop=h.scrollHeight; return d; }
  function setMeter(n){ var f=document.getElementById("dmeter"), p=Math.max(0,Math.min(100,50+n.respect*9)); f.style.width=p+"%"; f.style.background=n.respect<=-4?"#e08a8a":(n.respect<0?"#e6c07b":"#7fd1a3"); }
  function parseMood(t){ var m=t.match(/\|\|\s*r\s*:\s*(-?\d)/i); var mood=m?parseInt(m[1],10):0; return {text:t.replace(/\s*\|\|\s*r\s*:\s*-?\d.*$/i,"").trim(), mood:Math.max(-2,Math.min(2,mood))}; }
  function tryTalk(){ var n=nearNpc(); if(!n) return; CONV.npc=n;
    document.getElementById("dwho").textContent=n.name+"  ·  "+(n.lang==="en"?"english":"español");
    document.getElementById("dhist").innerHTML=""; addMsg("npc",n.line); setMeter(n);
    document.getElementById("dlg").style.display="flex"; setTimeout(function(){ var i=document.getElementById("din"); if(i) i.focus(); },60); }
  function askBrain(npc,userText,onChunk){ return new Promise(function(resolve){
    var id="npc_"+Math.random().toString(36).slice(2), done=false;
    function fin(r){ if(done)return; done=true; clearTimeout(to); window.removeEventListener("message",onMsg); resolve(r); }
    function onMsg(e){ var m=e.data; if(!m||m.id!==id) return;
      if(m.type==="osiris-npc-chunk"){ if(onChunk&&m.text) onChunk(m.text); return; }
      if(m.type==="osiris-npc-reply"){ fin(m.error?{err:m.error}:{text:m.text||""}); } }
    var to=setTimeout(function(){ fin({err:"timeout"}); },120000);
    window.addEventListener("message",onMsg);
    try{ window.parent.postMessage({type:"osiris-npc",id:id,sys:npc.sys,userText:userText,max:48,temp:0.5},"*"); }catch(x){ fin({err:"no host"}); } }); }
  function sendReply(){ if(CONV.busy||!CONV.npc) return; var inp=document.getElementById("din"); var text=(inp.value||"").trim(); if(!text) return;
    inp.value=""; addMsg("you",text); CONV.busy=true; document.getElementById("dsend").disabled=true;
    var hist=document.getElementById("dhist"), bubble=addMsg("npc","\u2026");
    askBrain(CONV.npc,text,function(partial){ bubble.innerHTML=esc(partial||"\u2026"); hist.scrollTop=hist.scrollHeight; }).then(function(r){
      if(r.err){ bubble.className="m sys"; bubble.innerHTML=esc("\u26a0 "+r.err); }
      else { var p=parseMood(r.text); bubble.innerHTML=esc(p.text||"\u2026"); }
      hist.scrollTop=hist.scrollHeight; CONV.busy=false; document.getElementById("dsend").disabled=false; }); }

  // ---- loop ----
  function step(){
    if(DEV){ // free camera to inspect the map
      var s=6; if(held("u"))cam.y-=s; if(held("d"))cam.y+=s; if(held("l"))cam.x-=s; if(held("r"))cam.x+=s;
    } else {
      var sp=(document.getElementById("dlg").style.display==="flex")?0:1.5, nx=player.x, ny=player.y;
      if(held("u"))ny-=sp; if(held("d"))ny+=sp; if(held("l"))nx-=sp; if(held("r"))nx+=sp;
      // collision (sample player box corners, 12px)
      var B=12;
      if(!solidPx(nx,player.y)&&!solidPx(nx+B,player.y)&&!solidPx(nx,player.y+B)&&!solidPx(nx+B,player.y+B)) player.x=nx;
      if(!solidPx(player.x,ny)&&!solidPx(player.x+B,ny)&&!solidPx(player.x,ny+B)&&!solidPx(player.x+B,ny+B)) player.y=ny;
      cam.x=(player.x+8)*SCALE; cam.y=(player.y+8)*SCALE;
      document.getElementById("talk").style.display=nearNpc()?"block":"none";
    }
    render(); requestAnimationFrame(step);
  }
  if(DEV){ cam.x=W*TILE*SCALE/2; cam.y=H*TILE*SCALE/2; document.getElementById("hint").textContent="DEV — arrows/WASD to pan the map"; document.getElementById("pad").style.opacity=.4; }
  img.onload=function(){ resize(); step(); };
  if(img.complete) img.onload();
})();
</script>
</body>
</html>
